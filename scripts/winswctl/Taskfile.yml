$schema: https://taskfile.dev/schema.json
version: "3"

# All commands run under task's bundled mvdan/sh interpreter, which on Windows
# ships coreutils (cat/cp/rm/ls/mkdir/mv/touch/find/xargs/mktemp/chmod/tar/gzip/
# base64/shasum) by default. No PowerShell, no Git Bash required.

silent: true

vars:
  SHIMS: shims

tasks:
  default:
    cmds:
      - task --list

  # --- Query ---

  list:
    desc: List all services
    cmds:
      - |
        matched=0
        for f in {{.SHIMS}}/*.exe; do
          [ -f "$f" ] || continue
          matched=1
          name="${f##*/}"
          name="${name##*\\}"
          echo "${name%.exe}"
        done
        if [ "$matched" -eq 0 ]; then echo "No services found."; fi

  status:*:
    desc: Show status of a service
    vars:
      SVC: "{{index .MATCH 0}}"
    cmds:
      - |
        exe="{{.SHIMS}}/{{.SVC}}.exe"
        if [ ! -f "$exe" ]; then
          echo "Service {{.SVC}} not found."
          exit 1
        fi
        printf "{{.SVC}}: "
        "$exe" status

  status:
    desc: Show status of all services
    cmds:
      - |
        matched=0
        for f in {{.SHIMS}}/*.exe; do
          [ -f "$f" ] || continue
          matched=1
          name="${f##*/}"
          name="${name##*\\}"
          printf "%s: " "${name%.exe}"
          "$f" status
        done
        if [ "$matched" -eq 0 ]; then echo "No services found."; fi

  # --- File layer: add / remove ---

  add:*:
    desc: Add a new service (copy winsw.exe + config template)
    vars:
      SVC: "{{index .MATCH 0}}"
    cmds:
      - |
        exe="{{.SHIMS}}/{{.SVC}}.exe"
        cfg="{{.SHIMS}}/{{.SVC}}.yml"
        if [ -f "$exe" ]; then
          echo "Service {{.SVC}} already exists, skipping"
          exit 0
        fi
        cp winsw.exe "$exe"
        if [ ! -f "$cfg" ]; then
          cat > "$cfg" <<'EOF'
        $schema: https://raw.githubusercontent.com/winsw/winsw/v2/doc/yamlConfigurationSchema.json
        id: {{.SVC}}
        name: {{.SVC}}
        description: {{.SVC}} service
        delayedAutoStart: true
        hideWindow: true
        workingDirectory:
        executable:
        arguments:
        EOF
          echo "Created config: $cfg"
        fi
        echo "Added service: {{.SVC}}"

  edit:*:
    desc: Edit service config with default editor
    vars:
      SVC: "{{index .MATCH 0}}"
    cmds:
      - |
        cfg="{{.SHIMS}}/{{.SVC}}.yml"
        if [ ! -f "$cfg" ]; then
          echo "Config {{.SVC}}.yml not found."
          exit 1
        fi
        if [ -n "$EDITOR" ]; then
          "$EDITOR" "$cfg"
        else
          notepad "$cfg"
        fi

  remove:*:
    desc: Remove service files (exe + config)
    vars:
      SVC: "{{index .MATCH 0}}"
    cmds:
      - |
        base="{{.SHIMS}}/{{.SVC}}"
        if [ ! -f "${base}.exe" ]; then
          echo "Service {{.SVC}} not found, nothing to remove"
          exit 0
        fi
        rm -f "${base}.exe" "${base}.yml" "${base}.xml"
        echo "Removed service: {{.SVC}}"

  reset:
    desc: Copy winsw.exe for services that have config but missing exe
    cmds:
      - |
        found=0
        count=0
        for cfg in {{.SHIMS}}/*.yml {{.SHIMS}}/*.xml; do
          [ -f "$cfg" ] || continue
          found=1
          svc="${cfg##*/}"
          svc="${svc##*\\}"
          svc="${svc%.*}"
          if [ ! -f "{{.SHIMS}}/$svc.exe" ]; then
            cp winsw.exe "{{.SHIMS}}/$svc.exe"
            echo "Restored {{.SHIMS}}/$svc.exe"
            count=$((count + 1))
          fi
        done
        if [ "$found" -eq 0 ]; then
          echo "No services found."
        elif [ "$count" -eq 0 ]; then
          echo "All services already have exe, nothing to do"
        else
          echo "Restored $count service(s)"
        fi

  # --- Service registration: install / uninstall ---

  install:*:
    desc: Register service with Windows
    vars:
      SVC: "{{index .MATCH 0}}"
    cmds:
      - |
        exe="{{.SHIMS}}/{{.SVC}}.exe"
        if [ ! -f "$exe" ]; then
          echo "Service {{.SVC}} not found. Run 'winswctl add:{{.SVC}}' first."
          exit 1
        fi
        "$exe" install

  uninstall:*:
    desc: Unregister service from Windows
    vars:
      SVC: "{{index .MATCH 0}}"
    cmds:
      - |
        exe="{{.SHIMS}}/{{.SVC}}.exe"
        if [ ! -f "$exe" ]; then
          echo "Service {{.SVC}} not found."
          exit 1
        fi
        "$exe" uninstall

  # --- Service control: start / stop / restart ---

  start:*:
    desc: Start a service
    vars:
      SVC: "{{index .MATCH 0}}"
    cmds:
      - |
        exe="{{.SHIMS}}/{{.SVC}}.exe"
        if [ ! -f "$exe" ]; then
          echo "Service {{.SVC}} not found."
          exit 1
        fi
        "$exe" start

  stop:*:
    desc: Stop a service
    vars:
      SVC: "{{index .MATCH 0}}"
    cmds:
      - |
        exe="{{.SHIMS}}/{{.SVC}}.exe"
        if [ ! -f "$exe" ]; then
          echo "Service {{.SVC}} not found."
          exit 1
        fi
        "$exe" stop

  restart:*:
    desc: Restart a service
    vars:
      SVC: "{{index .MATCH 0}}"
    cmds:
      - |
        exe="{{.SHIMS}}/{{.SVC}}.exe"
        if [ ! -f "$exe" ]; then
          echo "Service {{.SVC}} not found."
          exit 1
        fi
        "$exe" restart

  # --- Batch operations ---

  start:
    desc: Start all services
    cmds:
      - |
        matched=0
        for f in {{.SHIMS}}/*.exe; do
          [ -f "$f" ] || continue
          matched=1
          "$f" start
        done
        if [ "$matched" -eq 0 ]; then echo "No services found."; fi

  stop:
    desc: Stop all services
    cmds:
      - |
        matched=0
        for f in {{.SHIMS}}/*.exe; do
          [ -f "$f" ] || continue
          matched=1
          "$f" stop
        done
        if [ "$matched" -eq 0 ]; then echo "No services found."; fi

  restart:
    desc: Restart all services
    cmds:
      - |
        matched=0
        for f in {{.SHIMS}}/*.exe; do
          [ -f "$f" ] || continue
          matched=1
          "$f" restart
        done
        if [ "$matched" -eq 0 ]; then echo "No services found."; fi
